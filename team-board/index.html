<title>Team board</title>
<style>
:root{
  --bg:#0f2817;--surface:#1a2332;--surface-2:#1f2937;--lane:rgba(15,20,25,.72);--input:#1a1f2e;
  --ink:#e5e7eb;--muted:#8b92b1;--line:#2d3748;--line-2:#3d4759;
  --accent:#5ac991;--accent-2:#3d8a6f;--accent-soft:rgba(90,201,145,.15);--on-accent:#0b1f15;--cyan:#00d9ff;
  --pink:#e85a7a;--pink-soft:rgba(232,90,122,.15);--amber:#f59e0b;--amber-soft:rgba(245,158,11,.15);--red:#ef4444;--red-soft:rgba(239,68,68,.12);
  --card:linear-gradient(135deg,#1a2332 0%,#1f2937 100%);
  --font:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#0f2817 linear-gradient(135deg,#1a3a2a 0%,#0f2817 50%,#1a3a2a 100%) fixed;min-height:100vh;color:var(--ink);font:15px/1.45 var(--font);font-variant-numeric:tabular-nums;letter-spacing:.2px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)!important;box-shadow:0 0 10px rgba(90,201,145,.3)}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:1480px;margin:0 auto;padding:20px 20px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin-bottom:18px}
header.top h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.01em;background:linear-gradient(135deg,#5ac991 0%,#3d8a6f 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--accent)}
.sprintline{color:var(--muted);font-size:14px;margin-top:2px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sprintline select{border:1px solid var(--line);background:var(--input);border-radius:6px;padding:3px 6px}
.spacer{flex:1}
nav.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto;max-width:100%}
nav.tabs button{white-space:nowrap;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;background:transparent;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted)}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs button.admin-tab{color:var(--amber)}
nav.tabs button.admin-tab[aria-selected="true"]{border-bottom-color:var(--amber)}
.hdr-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--line);color:var(--ink);padding:8px 16px;border-radius:5px;font-weight:600;line-height:1.3}
.btn:hover{background:var(--line-2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:linear-gradient(135deg,#5ac991 0%,#3d8a6f 100%);border-color:transparent;color:var(--on-accent);box-shadow:0 4px 15px rgba(90,201,145,.3)}
.btn.primary:hover{box-shadow:0 6px 20px rgba(90,201,145,.5)}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn.danger:hover{background:var(--red-soft)}
.btn.ghost{background:transparent}
.btn.small{padding:4px 10px;font-size:13px}
.notice{background:var(--amber-soft);border:1px solid var(--amber);color:var(--ink);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.notice.err{background:var(--red-soft);border-color:var(--red)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--input);border-radius:7px;padding:6px 10px;max-width:100%}
.toolbar input[type=search]{min-width:min(220px,100%)}
.goal{color:var(--muted);font-size:14px}
/* who / saving */
.who{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 4px 3px 3px;font-size:13px;font-weight:600}
.who .avatar{margin:0;width:28px;height:28px}
.who button{border:0;background:var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.who button:hover{background:var(--line-2)}
.who.locked{padding:3px 12px}
.save{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}
.save i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.save.busy i{background:var(--cyan);animation:pulse 1s infinite}
.save.warn{color:var(--amber)}.save.warn i{background:var(--amber)}
.save.err{color:var(--red)}.save.err i{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
.tchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--cyan);color:var(--cyan);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;background:rgba(0,217,255,.08)}
/* board */
.board-scroll{overflow-x:auto}
.board{display:grid;gap:12px;align-items:start}
.col{background:var(--lane);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.col.over{outline:2px dashed var(--accent);outline-offset:-4px}
.col.over .col-body{background:rgba(90,201,145,.08)}
.col-h{position:relative;display:flex;align-items:center;gap:8px;background:var(--cc);color:#fff;padding:10px 8px 10px 12px;cursor:grab;user-select:none}
.col-h b{display:block;font-size:15px;font-weight:700;line-height:1.2}
.col-h small{display:block;font-size:12px;opacity:.85;white-space:nowrap}
.col-h .hd{flex:1;min-width:0}
.col-menu{border:0;background:transparent;color:#fff;width:28px;height:28px;border-radius:5px;font-size:18px;line-height:1;padding:0}
.col-menu:hover,.col-menu[aria-expanded="true"]{background:rgba(255,255,255,.18)}
.menu{position:absolute;right:6px;top:calc(100% + 4px);z-index:20;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.5);padding:4px;min-width:180px;cursor:default}
.menu button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--ink);padding:8px 10px;border-radius:5px;font-size:14px}
.menu button:hover:not(:disabled){background:var(--accent-soft);color:var(--accent)}
.menu button:disabled{opacity:.35;cursor:default}
.col-body{padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:calc(100vh - 260px);min-height:260px;flex:1}
.col-add{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:8px;font-weight:600;font-size:13px}
.col-add:hover{border-color:var(--accent);color:var(--accent)}
.col.dragging{opacity:.45}
.col.col-before{box-shadow:inset 4px 0 0 var(--accent)}
.col.col-after{box-shadow:inset -4px 0 0 var(--accent)}
.col[data-status="blocked"] .col-body{background:rgba(239,68,68,.06)}
.reason{grid-column:2/-1;font-size:12px;color:var(--red)}
.card{--tc:var(--accent);position:relative;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:6px;padding:9px 9px 8px 10px;cursor:grab;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 8px;align-items:start;flex:none}
.card.t-task{--tc:var(--cyan)}.card.t-bug{--tc:var(--red)}
.card:hover{border-color:var(--accent);border-left-color:var(--tc);box-shadow:0 4px 16px rgba(90,201,145,.18)}
.card.blocked{box-shadow:inset 0 0 0 1px rgba(239,68,68,.6)}
.card.is-done .c-title{color:var(--muted)}
.c-type{color:var(--tc,var(--accent));display:grid;place-items:center;width:20px;height:20px;margin-top:1px}
.c-title{font-weight:500;line-height:1.35;font-size:14px;overflow-wrap:anywhere}
.c-id{color:var(--muted);font-size:12px;font-weight:600;margin-right:5px}
.card .avatar{margin:0;width:28px;height:28px}
.avatar.add{background:transparent;border:1.5px dashed #4a5568;color:#6b7280}
.labels{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px}
.lbl{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;line-height:1.6}
.c-foot{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;color:var(--muted);font-size:12px;min-height:34px}
.pts-b{min-width:26px;height:22px;padding:0 6px;border-radius:11px;border:2px solid var(--amber);color:var(--ink);font-weight:700;font-size:12px;display:inline-grid;place-items:center}
.ci{display:inline-flex;align-items:center;gap:3px}
.ci.warn{color:var(--amber);font-weight:700}
.ci.red{color:var(--red);font-weight:700}
.ci.run{color:var(--cyan);font-weight:700}
.ci.ok{color:var(--accent)}
.c-check{margin-left:auto;width:34px;height:34px;border-radius:50%;border:2px solid rgba(90,201,145,.3);background:transparent;color:rgba(90,201,145,.4);display:grid;place-items:center;padding:0;flex:none}
.c-check:hover{border-color:var(--accent);color:var(--accent)}
.c-check.on{background:var(--accent);border-color:var(--accent);color:#0b1f15}
.board-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:linear-gradient(90deg,#1a3a2a,#1f2937);border:1px solid var(--line);border-radius:8px;padding:8px 10px 8px 16px;margin-bottom:14px}
.board-bar .bt{font-weight:700;font-size:16px}
.board-bar .bs{color:var(--muted);font-size:13px;margin-right:auto}
.board-bar input,.board-bar select{border:1px solid var(--line);background:var(--input);border-radius:6px;padding:6px 10px;max-width:100%}
.board-bar input{min-width:min(200px,100%)}
.chip{display:inline-block;border-radius:4px;padding:1px 6px;background:var(--line);color:var(--muted);font-size:12px;white-space:nowrap}
.chip.erp{border:1px solid var(--line);background:transparent}
.chip.blk{background:var(--red);color:#fff}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.chip.bad{background:var(--red-soft);color:var(--red)}
.chip.info{background:rgba(0,217,255,.12);color:var(--cyan)}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;font-size:11px;font-weight:700;margin-left:auto;flex:none}
.avatar.none{background:var(--line);color:var(--muted)}
/* panels / tables */
.panel{background:var(--card);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.35);border-radius:8px;padding:16px;margin-bottom:16px;min-width:0}
.panel h2{font-size:16px;margin:0 0 12px;padding-bottom:6px;border-bottom:2px solid var(--accent)}
.panel h3{font-size:15px;margin:0 0 8px}
.panel-h{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--accent)}
.panel-h h2{border:0;margin:0;padding:0;margin-right:auto}
.tbl-scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:500;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
td small,.muted{color:var(--muted)}
.linkish{background:none;border:0;padding:0;text-align:left;font-weight:500;color:var(--ink)}
.linkish:hover{text-decoration:underline}
.two{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.row-form{display:flex;flex-wrap:wrap;gap:8px}
.row-form input,.row-form select{border:1px solid var(--line);background:var(--input);border-radius:7px;padding:6px 9px;min-width:0;max-width:100%}
.load{display:flex;align-items:center;gap:10px;min-width:200px}
.bar{flex:1;height:10px;background:#0f1419;border-radius:5px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#5ac991,#00d9ff);border-radius:5px}
.bar i.warn{background:var(--amber)}
.bar i.over{background:var(--red)}
.load span{width:48px;text-align:right;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.35);border-radius:8px;padding:14px 16px}
.stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;color:var(--cyan)}
.stat small{color:var(--muted);font-size:13px}
svg text{fill:var(--muted);font:12px var(--font)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px}
.empty{color:var(--muted);padding:18px 4px;font-size:14px}
/* dialogs */
dialog{border:2px solid var(--line);border-top:3px solid var(--accent);border-radius:8px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,94vw);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(4px)}
dialog form.pad,.dpad{padding:20px}
dialog h2{margin:0 0 14px;font-size:19px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.grid .full{grid-column:1/-1}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label input,label select,label textarea{border:1px solid var(--line);background:var(--input);border-radius:7px;padding:7px 9px;font-size:14px;color:var(--ink);min-width:0}
label.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#0f1419;padding:9px 12px 9px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;display:flex;gap:12px;align-items:center;z-index:100;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;pointer-events:auto}
.toast button{border:0;background:#0f1419;color:var(--accent);border-radius:5px;padding:4px 10px;font-weight:700}
@media (prefers-reduced-motion:reduce){.toast{transition:none}.save.busy i{animation:none}}
/* PIN pad */
#pinDlg{width:min(460px,96vw);border-top-color:var(--cyan)}
.pin-wrap{padding:22px;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.pin-wrap h2{margin:0;font-size:20px;text-align:center}
.pin-wrap p{margin:0;color:var(--muted);text-align:center;font-size:14px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px;max-height:52vh;overflow:auto;padding:2px}
.pick button{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px 6px;font-weight:600;font-size:14px;min-height:92px}
.pick button:hover{border-color:var(--accent)}
.pick .avatar{margin:0;width:40px;height:40px;font-size:14px}
.pick small{color:var(--muted);font-weight:400;font-size:11px}
.dots{display:flex;justify-content:center;gap:16px;margin:4px 0}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{height:64px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:24px;font-weight:700;touch-action:manipulation}
.keys button:hover{border-color:var(--accent)}
.keys button:active{background:var(--accent-soft)}
.keys button.fn{font-size:14px;color:var(--muted)}
.pin-err{color:var(--red);text-align:center;min-height:1.4em;font-size:14px;font-weight:600}
.pin-who{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:17px}
.pin-who .avatar{margin:0;width:38px;height:38px;font-size:14px}
/* task window */
#twDlg{width:min(1200px,97vw);height:min(92vh,960px);border-top:0;display:none;padding:0}
#twDlg[open]{display:flex}
#twBody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);width:100%}
@media (max-width:860px){#twBody{grid-template-columns:minmax(0,1fr);overflow:auto}#twDlg{height:auto;max-height:94vh;overflow:auto}}
.tw-main{padding:18px 22px 24px;overflow:auto;display:flex;flex-direction:column;gap:18px;min-width:0}
.tw-side{background:#161e2b;border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:auto}
@media (max-width:860px){.tw-main,.tw-side{overflow:visible}.tw-side{border-left:0;border-top:1px solid var(--line)}}
.tw-title{width:100%;font-size:21px;font-weight:700;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;margin-left:-6px}
.tw-title:hover{border-color:var(--line)}
.tw-by{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tw-sec h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;display:flex;gap:10px;align-items:center}
.tw-sec h3 small{letter-spacing:0;text-transform:none;font-weight:600;color:var(--ink)}
.tw-sec textarea{width:100%;border:1px solid var(--line);background:var(--input);border-radius:7px;padding:9px 11px;resize:vertical;min-height:84px}
.cl-item{display:flex;align-items:center;gap:10px;padding:5px 4px;border-radius:6px}
.cl-item:hover{background:var(--surface-2)}
.cl-item span{flex:1;overflow-wrap:anywhere}
.cl-item.done span{color:var(--muted);text-decoration:line-through}
.cl-box{width:22px;height:22px;border-radius:5px;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0;color:var(--on-accent);flex:none}
.cl-box.on{background:var(--accent);border-color:var(--accent)}
.xbtn{border:0;background:transparent;color:var(--muted);width:28px;height:28px;border-radius:5px;font-size:18px;line-height:1;padding:0;flex:none}
.xbtn:hover{background:var(--red-soft);color:var(--red)}
.add-row{display:flex;gap:8px;margin-top:6px}
.add-row input{flex:1;min-width:0;border:1px solid var(--line);background:var(--input);border-radius:7px;padding:7px 10px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.file{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.file .thumb{height:90px;background:#0f1419 center/cover no-repeat;display:grid;place-items:center;color:var(--muted);font-weight:800;font-size:13px;border:0;width:100%;padding:0}
.file .fn{padding:6px 8px 0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .fm{padding:0 8px 6px;font-size:11px;color:var(--muted);display:flex;gap:4px;align-items:center}
.file .fm .xbtn{margin-left:auto;width:24px;height:24px;font-size:15px}
.file .fm button.sv{border:0;background:transparent;color:var(--accent);font-size:11px;font-weight:700;padding:0}
.drop-hint{border:1px dashed var(--line);border-radius:8px;padding:12px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.drop-hint.over{border-color:var(--accent);background:var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.feed-item{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.feed-item:first-child{border-top:0}
.feed-item .avatar{margin:0;width:30px;height:30px}
.feed-item .fb{flex:1;min-width:0}
.feed-item .fh{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.feed-item .fh b{color:var(--ink)}
.feed-item .fh .acts{margin-left:auto;display:flex;gap:6px}
.feed-item p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.feed-item.act{padding:6px 0;font-size:13px;color:var(--muted);align-items:center}
.feed-item.act .avatar{width:22px;height:22px;font-size:9px}

      <label class="full" id="nfProductWrap">Product from the ERP<select id="nfProduct"></select></label>

      <label>Unit<input id="nfUnit" maxlength="20" value="units"></label>
      <label class="full">Title<input id="nfTitle" name="title" required maxlength="160" autocomplete="off" placeholder="e.g. Assemble 15 Defenders"></label>
      <label>Type<select id="nfType" name="type"><option value="story">Story</option><option value="task">Task</option><option value="bug">Bug</option></select></label>
      <label>Priority<select id="nfPriority" name="priority"><option value="1">High</option><option value="2" selected>Medium</option><option value="3">Low</option></select></label>

<script>
"use strict";
/* ================= constants & helpers ================= */
const COLS={todo:"To do",doing:"In progress",blocked:"Blocked",review:"Review",done:"Done"};
const DEFAULT_ORDER=["todo","doing","blocked","review","done"];
const ACCESS={admin:"Admin",worker:"Worker",viewer:"Viewer"};
const AVAIL={available:["Available","ok"],busy:["Busy","warn"],away:["Away","bad"]};
const KIND={comment:{label:"Comment",cls:"k-comment"},issue:{label:"Issue",cls:"k-issue"},lesson:{label:"What went wrong",cls:"k-lesson"}};
const PRIO={1:"High",2:"Medium",3:"Low"};
const TYPES={story:"Story",task:"Task",bug:"Bug"};
const DEFAULT_SETTINGS={teamName:"Team board",keyPrefix:"DF",lockMinutes:3,dailyBackup:true,trashDays:30,keepDaily:14,keepOther:20};
const DAY=86400000;
const MEDAL=["#f5c451","#c9d1dc","#d08a4f"];
const hr=v=>Math.round((+v||0)*100)/100;
const fmtH=v=>{v=hr(v);return (Number.isInteger(v)?v:v.toFixed(2).replace(/0$/,""))+" h"};
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{v?sessionStorage.setItem(k,v):sessionStorage.removeItem(k)}catch(e){}}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const todayIso=()=>iso(new Date());
const parseDate=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1).getTime()};
const fmtDate=s=>new Date(parseDate(s)).toLocaleDateString(undefined,{month:"short",day:"numeric"});
const fmtStamp=ms=>ms?new Date(ms).toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}):"";
const fmtDay=ms=>new Date(ms).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
const initials=n=>String(n||"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("")||"?";
const firstName=n=>String(n||"").split(/\s+/)[0]||"Someone";
const byName=(a,b)=>a.name.localeCompare(b.name);
const fmtBytes=b=>b<1024?b+" B":b<1048576?(b/1024).toFixed(0)+" KB":(b/1048576).toFixed(1)+" MB";
const clock=()=>new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
function timeAgo(ms){const s=(Date.now()-ms)/1000;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400)return Math.floor(s/3600)+" h ago";const d=Math.floor(s/86400);return d===1?"yesterday":d<30?d+" days ago":fmtDay(ms)}
function elapsed(ms){ms=Math.max(0,ms);const h=Math.floor(ms/3600000),m=Math.floor(ms/60000)%60,s=Math.floor(ms/1000)%60;return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
const vals=o=>o&&typeof o==="object"?Object.entries(o).filter(([k,v])=>v&&typeof v==="object"&&!v.deleted).map(([k,v])=>({...v,id:k})):[];

/* ================= state ================= */
const state={tasks:[],members:[],sprints:[],logs:[],backups:[],settings:{...DEFAULT_SETTINGS},order:DEFAULT_ORDER.slice(),
  view:ls.get("tb.view")||"overview",chartMode:"burndown",type:"",menuFor:null,sprintId:null,q:"",who:"",
  topScope:"sprint",followActive:true,tv:false,tvSlide:0,tvPaused:false,
  adm:{tab:"members",q:"",who:"",kind:"",show:150},loaded:{},isOwner:false};
const raw={members:{},sprints:{},tasks:{},config:{}};   // untouched documents, for backups
let db=null,downloads=null,assets=null,userCap=null;
const clientId=ss.get("tb.client")||uid("c");ss.set("tb.client",clientId);

const live=a=>a.filter(x=>!x.deleted);
const member=id=>state.members.find(m=>m.id===id);
const sprint=id=>state.sprints.find(s=>s.id===id&&!s.deleted);
const task=id=>state.tasks.find(t=>t.id===id);
const members=()=>live(state.members).sort(byName);
const sortedSprints=()=>live(state.sprints).sort((a,b)=>parseDate(a.start)-parseDate(b.start));
const mName=id=>{const m=member(id);return m?m.name+(m.deleted?" (removed)":""):"Someone"};
const avatar=(id,cls="")=>{const m=member(id);return m?`<span class="avatar ${cls}" title="${esc(m.name)}">${esc(initials(m.name))}</span>`:`<span class="avatar none ${cls}">?</span>`};

/* ================= toast & confirm ================= */
function toast(msg,undo){
  const t=$("#toast");$("#toastMsg").textContent=msg;const b=$("#toastBtn");
  b.hidden=!undo;b.onclick=null;if(undo){b.textContent=undo.label||"Undo";b.onclick=()=>{t.classList.remove("show");undo.fn()}}
  t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),undo?7000:2800);
}
function ask({title,body="",ok="OK",danger=false,typeWord=null}){
  return new Promise(res=>{
    const d=$("#askDlg");$("#askTitle").textContent=title;$("#askBody").textContent=body;
    const okB=$("#askOk");okB.textContent=ok;okB.className="btn "+(danger?"danger":"primary");
    const tw=$("#askTypeWrap"),ti=$("#askType");tw.hidden=!typeWord;ti.value="";
    if(typeWord)$("#askTypeLbl").textContent=`Type ${typeWord} to confirm`;
    let done=false;const fin=v=>{if(done)return;done=true;d.close();res(v)};
    $("#askForm").onsubmit=e=>{e.preventDefault();if(typeWord&&ti.value.trim()!==typeWord){ti.focus();return}fin(true)};
    $("#askCancel").onclick=()=>fin(false);d.onclose=()=>fin(false);
    d.showModal();(typeWord?ti:$("#askCancel")).focus();
  });
}
function errMsg(e){
  const c=e&&e.code;
  if(c==="invalid_argument")return "The board refused this change. Your Claude account may only have view access to this board; ask the board owner to make you a Contributor.";
  if(c==="quota_exceeded")return "The board is full. An admin can empty the Trash or delete old backups to make room.";
  if(c==="resource_exhausted")return "Too many changes at once. Wait a moment and try again.";
  if(c==="revoked"||c==="not_granted")return "This view can no longer save changes. Reload the page.";
  return "Couldn't save the change. It will be retried.";
}

/* ================= write queue: retries, ordering, survives reloads ================= */
const FATAL=["invalid_argument","quota_exceeded","not_granted","revoked","capability_disabled","capability_removed","transform_error"];
const Q={ops:[],busy:false,fails:0,err:null,wait:{}};
function saveQ(){ls.set("tb.queue",Q.ops.length?JSON.stringify(Q.ops.map(({k,path,mode,data,quiet})=>({k,path,mode,data,quiet}))):"")}
try{const p=JSON.parse(ls.get("tb.queue")||"[]");if(Array.isArray(p))Q.ops=p.filter(o=>o&&o.path&&o.mode)}catch(e){}
function enqueue(path,mode,data,opts={}){
  if(!db){localApply(path,mode,data);return Promise.resolve(true)}
  const op={k:uid("q"),path,mode,data,quiet:!!opts.quiet};Q.ops.push(op);saveQ();saveStatus();
  const p=new Promise(r=>Q.wait[op.k]=r);pump();return p;
}
async function execOp(op){
  const ref=db.doc(op.path);
  if(op.mode==="set")return ref.set(op.data);
  if(op.mode==="update")return ref.update(op.data);
  if(op.mode==="delete")return ref.delete();
  if(op.mode==="merge"){try{return await ref.update(op.data)}catch(e){if(!e||e.code!=="invalid_argument")throw e;const s=await ref.get();if(s.exists)throw e;return ref.set(op.data)}}
}
async function pump(){
  if(Q.busy||!db)return;Q.busy=true;
  while(Q.ops.length){
    const op=Q.ops[0];
    try{await execOp(op);Q.ops.shift();saveQ();Q.fails=0;Q.err=null;done(op,true)}
    catch(e){
      const code=e&&e.code;
      if(FATAL.includes(code)){Q.ops.shift();saveQ();done(op,false);if(!op.quiet){Q.err=errMsg(e);toast(Q.err)}continue}
      Q.fails++;saveStatus();await sleep(Math.min(30000,800*2**Q.fails)+Math.random()*500);
    }
    saveStatus();
  }
  Q.busy=false;saveStatus();
}
function done(op,ok){const r=Q.wait[op.k];delete Q.wait[op.k];if(r)r(ok)}
function saveStatus(){
  const el=$("#saveState");if(!el)return;const n=Q.ops.length;let cls="",txt;
  if(!db){cls="warn";txt="Not connected, changes stay on this screen"}
  else if(n&&Q.fails>1){cls="warn";txt=`Offline, ${n} change${n>1?"s":""} waiting. Retrying`}
  else if(n){cls="busy";txt="Saving…"}
  else if(Q.err){cls="err";txt="Last change was not saved"}
  else txt="All changes saved";
  el.className="save "+cls;el.lastElementChild.textContent=txt;el.title=Q.err||"";
}
window.addEventListener("online",()=>{Q.fails=0;pump()});
window.addEventListener("beforeunload",e=>{if(Q.ops.length){e.preventDefault();e.returnValue=""}});
function localApply(path,mode,data){
  const [col,id]=path.split("/");if(!raw[col]||path.split("/").length!==2)return;
  if(mode==="delete")delete raw[col][id];
  else if(mode==="set"||!raw[col][id])raw[col][id]=JSON.parse(JSON.stringify(data));
  else raw[col][id]=deepMerge(raw[col][id],data);
  rebuild(col);render();
}
function deepMerge(a,b){const o={...a};for(const[k,v]of Object.entries(b)){o[k]=v&&typeof v==="object"&&!Array.isArray(v)&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k])?deepMerge(a[k],v):v}return o}

/* ================= normalising what comes out of the store ================= */
const num=(v,d=0)=>{v=Number(v);return isFinite(v)?v:d};
const str=(v,max=500)=>typeof v==="string"?v.slice(0,max):"";
const isoOk=v=>/^\d{4}-\d{2}-\d{2}$/.test(v);
const CLEAN={
  tasks:(id,o)=>{
    const wl=vals(o.worklogs).map(w=>({...w,hours:Math.max(0,num(w.hours)),units:Math.max(0,num(w.units)),date:isoOk(w.date)?w.date:iso(new Date(num(w.at,Date.now()))),by:str(w.by,80),note:str(w.note,300),at:num(w.at)}));
    const timers={};if(o.timers&&typeof o.timers==="object")for(const[k,v]of Object.entries(o.timers))if(v&&num(v.startedAt))timers[k]={startedAt:num(v.startedAt)};
    return {id,title:str(o.title,300)||"Untitled",type:TYPES[o.type]?o.type:"task",status:COLS[o.status]?o.status:"todo",
    points:num(o.points),priority:[1,2,3].includes(o.priority)?o.priority:2,estimateH:num(o.estimateH),
    key:o.key!=null?num(o.key,null):null,erpRef:str(o.erpRef,60),description:str(o.description,20000),blockedReason:str(o.blockedReason,200),
    labels:Array.isArray(o.labels)?o.labels.filter(x=>typeof x==="string").map(x=>x.slice(0,30)).slice(0,8):[],
    assignees:normAssignees(o),legacyAssignee:typeof o.assignee==="string"&&o.assignee?o.assignee:null,sprintId:typeof o.sprintId==="string"&&o.sprintId?o.sprintId:null,
    createdAt:num(o.createdAt,null),createdBy:str(o.createdBy,80),startedAt:num(o.startedAt)||null,doneAt:num(o.doneAt)||null,
    blockedAt:num(o.blockedAt)||null,blockedMs:num(o.blockedMs),
    checklist:vals(o.checklist).map(c=>({...c,text:str(c.text,300),done:!!c.done,order:num(c.order)})).sort((a,b)=>a.order-b.order),
    files:vals(o.files).map(f=>({...f,name:str(f.name,200)||"file",size:num(f.size),type:str(f.type,100),at:num(f.at)})).sort((a,b)=>a.at-b.at),
    comments:vals(o.comments).map(c=>({...c,kind:KIND[c.kind]?c.kind:"comment",text:str(c.text,4000),at:num(c.at),resolved:!!c.resolved,by:str(c.by,80)})).sort((a,b)=>a.at-b.at),
    activity:vals(o.activity).map(a=>({...a,text:str(a.text,400),at:num(a.at),by:str(a.by,80)})).sort((a,b)=>a.at-b.at),
    worklogs:wl.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.at-b.at),loggedH:hr(wl.reduce((s,w)=>s+w.hours,0)),timers,
    qty:Math.max(0,Math.round(num(o.qty)*100)/100),unit:str(o.unit,20)||"units",doneUnits:Math.round(wl.reduce((s,w)=>s+w.units,0)*100)/100,
    productId:o.productId!=null&&o.productId!==""&&isFinite(Number(o.productId))?Number(o.productId):null,productName:str(o.productName,120),
    deleted:!!o.deleted,deletedAt:num(o.deletedAt)||null,deletedBy:str(o.deletedBy,80)}},
  members:(id,o)=>({id,name:str(o.name,80)||"Unnamed",title:str(o.title,60),access:ACCESS[o.access]?o.access:"worker",
    labels:Array.isArray(o.labels)?o.labels.filter(x=>typeof x==="string").map(x=>x.slice(0,30)).slice(0,10):[],
    weeklyH:Math.max(0,Math.min(80,num(o.weeklyH,40))),availability:AVAIL[o.availability]?o.availability:"available",
    timeOff:Array.isArray(o.timeOff)?o.timeOff.filter(x=>x&&isoOk(x.from)&&isoOk(x.to)).map(x=>({from:x.from,to:x.to,note:str(x.note,80)})):[],
    pinHash:typeof o.pinHash==="string"?o.pinHash:null,pinSalt:typeof o.pinSalt==="string"?o.pinSalt:"",pinSetAt:num(o.pinSetAt)||null,
    createdAt:num(o.createdAt),deleted:!!o.deleted,deletedAt:num(o.deletedAt)||null,deletedBy:str(o.deletedBy,80)}),
  sprints:(id,o)=>({id,name:str(o.name,60)||"Sprint",goal:str(o.goal,200),state:["planned","active","closed"].includes(o.state)?o.state:"planned",
    start:isoOk(o.start)?o.start:todayIso(),end:isoOk(o.end)?o.end:todayIso(),
    deleted:!!o.deleted,deletedAt:num(o.deletedAt)||null,deletedBy:str(o.deletedBy,80)})};
function normAssignees(o){
  let list=[];const a=o.assignees;
  if(Array.isArray(a))list=a.filter(x=>typeof x==="string"&&x);
  else if(a&&typeof a==="object")list=Object.entries(a).filter(([k,v])=>v).sort((x,y)=>num(x[1].at)-num(y[1].at)).map(x=>x[0]);
  if(typeof o.assignee==="string"&&o.assignee&&!list.includes(o.assignee))list.unshift(o.assignee);
  return list.slice(0,20);
}
function rebuild(col){
  if(col==="config"){
    const b=raw.config.board||{},s=raw.config.settings||{};
    state.order=normOrder(b.order);
    const S={...DEFAULT_SETTINGS};
    if(typeof s.teamName==="string"&&s.teamName.trim())S.teamName=s.teamName.slice(0,60);
    if(typeof s.keyPrefix==="string"&&/^[A-Za-z0-9]{1,6}$/.test(s.keyPrefix))S.keyPrefix=s.keyPrefix.toUpperCase();
    if([1,2,3,5,10,15,30,60].includes(s.lockMinutes))S.lockMinutes=s.lockMinutes;
    if(typeof s.dailyBackup==="boolean")S.dailyBackup=s.dailyBackup;
    if([7,14,30,60,90].includes(s.trashDays))S.trashDays=s.trashDays;
    state.settings=S;return;
  }
  state[col]=Object.entries(raw[col]).map(([id,o])=>{try{return CLEAN[col](id,o||{})}catch(e){console.error(e);return null}}).filter(Boolean);
  if(col==="tasks")state.tasks.forEach(t=>{t.assignee=t.assignees[0]||null});
  if(col==="sprints")pickSprint();
}
function normOrder(o){const ok=Array.isArray(o)?o.filter((k,i)=>COLS[k]&&o.indexOf(k)===i):[];DEFAULT_ORDER.forEach(k=>{if(!ok.includes(k))ok.push(k)});return ok}
function subscribe(col){
  db.collection(col).onSnapshot(s=>{
    const r={};s.docs.forEach(d=>{r[d.id]=d.data()});raw[col]=r;rebuild(col);state.loaded[col]=true;render();maybeDailyBackup();
  },e=>snapErr(e));
}
function snapErr(e){if(e&&e.code==="revoked")setNotice("This board is read-only in this view now. Reload to reconnect.","err");else if(e&&e.code==="unavailable")setNotice("Lost the live connection to the board. Reload the page to reconnect.","err")}
function setNotice(html,cls=""){$("#notice").innerHTML=html?`<div class="notice ${cls}">${html}</div>`:""}

function pickSprint(){
  const s=sortedSprints();const active=s.find(x=>x.state==="active");
  if((state.followActive||state.tv)&&active){state.sprintId=active.id;return}
  if(state.sprintId&&sprint(state.sprintId))return;
  state.sprintId=active?active.id:(s.find(x=>x.state==="planned")||s[s.length-1]||{}).id||null;
}

/* ================= activity log (non-task events), one document per day ================= */
function logEvent(kind,text,by){
  const day=todayIso(),id=uid("e");
  return enqueue("log/"+day,"merge",{day,entries:{[id]:{at:Date.now(),by:by||null,kind,text:String(text).slice(0,400)}}},{quiet:true});
}
/* ================= accounts & PINs =================
   Anyone can look. Changing anything asks "who are you?" and a 4-digit PIN.
   A worker creates their own PIN the first time. The unlock lasts a few minutes
   of inactivity (Settings), so a shared touchscreen locks itself again. */
const session={id:null,until:0};
try{const s=JSON.parse(ss.get("tb.session")||"null");if(s&&s.until>Date.now()){session.id=s.id;session.until=s.until}}catch(e){}
const lockMs=()=>state.settings.lockMinutes*60000;
function me(){
  if(session.id&&Date.now()<session.until){const m=member(session.id);if(m&&!m.deleted)return m}
  return null;
}
function touchSession(){if(session.id){session.until=Date.now()+lockMs();ss.set("tb.session",JSON.stringify(session))}}
function unlock(m){session.id=m.id;touchSession();ls.set("tb.last",m.id);renderWho();render();if($("#twDlg").open)renderTW()}
function lockNow(quiet){session.id=null;session.until=0;ss.set("tb.session","");if(state.view==="admin"||state.view==="erp")state.view="overview";renderWho();render();if($("#twDlg").open)renderTW();if(!quiet)toast("Locked")}
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,()=>{if(me())touchSession()},{passive:true}));
setInterval(()=>{if(session.id&&!me())lockNow(true)},5000);

async function hashPin(salt,pin){
  const enc=new TextEncoder();
  try{
    const key=await crypto.subtle.importKey("raw",enc.encode(pin),"PBKDF2",false,["deriveBits"]);
    const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode("teamboard|"+salt),iterations:60000,hash:"SHA-256"},key,256);
    return "p1$"+[...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,"0")).join("");
  }catch(e){ // very old browser: plain FNV-style fallback
    let h=2166136261;const s="teamboard|"+salt+"|"+pin;for(let r=0;r<5000;r++)for(let i=0;i<s.length;i++){h^=s.charCodeAt(i)+r;h=Math.imul(h,16777619)>>>0}
    return "f1$"+h.toString(16);
  }
}
const fails={get(id){try{return JSON.parse(ls.get("tb.fail."+id)||"{}")}catch(e){return{}}},set(id,v){ls.set("tb.fail."+id,v?JSON.stringify(v):"")}};

/* who(): resolves the unlocked member, asking for a PIN if needed. null = cancelled */
function who(){const m=me();if(m){touchSession();return Promise.resolve(m)}return pinFlow()}
/* act(fn): run fn(member) only for someone allowed to change the board */
async function act(fn,{admin=false}={}){
  const m=await who();if(!m)return false;
  if(m.access==="viewer"){toast("Your account can view the board but not change it. Ask an admin.");return false}
  if(admin&&m.access!=="admin"){toast("Only admins can do this.");return false}
  return fn(m);
}

let pin=null; // {stage, memberId, digits, first, resolve, err}
function pinFlow(stage){
  return new Promise(res=>{
    if(pin&&pin.resolve)pin.resolve(null);
    const noAdmin=!members().some(m=>m.access==="admin");
    pin={stage:stage||(noAdmin&&!members().length?"setup":"pick"),memberId:null,digits:"",first:null,resolve:res,err:"",q:""};
    renderPin();const d=$("#pinDlg");if(!d.open)d.showModal();
  });
}
function endPin(m){const r=pin&&pin.resolve;pin=null;const d=$("#pinDlg");if(d.open)d.close();if(r)r(m||null)}
$("#pinDlg").addEventListener("close",()=>{if(pin){const r=pin.resolve;pin=null;if(r)r(null)}});
function renderPin(){
  if(!pin)return;const b=$("#pinBody");const m=member(pin.memberId);
  const dots=`<div class="dots" id="pinDots">${[0,1,2,3].map(i=>`<i class="${i<pin.digits.length?"on":""}"></i>`).join("")}</div>`;
  const keys=`<div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-k="${n}">${n}</button>`).join("")}
    <button type="button" class="fn" data-k="back" aria-label="Delete last digit">⌫</button><button type="button" data-k="0">0</button><button type="button" class="fn" data-pcancel>Cancel</button></div>`;
  const whoLine=m?`<div class="pin-who">${avatar(m.id)}<span>${esc(m.name)}</span></div>`:"";
  if(pin.stage==="setup"){
    if(userCap&&!state.isOwner){b.innerHTML=`<h2>Board not set up yet</h2><p>The board owner needs to open it first and create the admin account.</p><div class="actions" style="justify-content:center"><button type="button" class="btn" data-pcancel>Close</button></div>`;return}
    b.innerHTML=`<h2>Set up the board</h2><p>Nobody has an account yet. Create the first admin account. You can add the rest of the team from the Admin tab afterwards.</p>
      <form id="setupForm" class="grid" style="grid-template-columns:1fr"><label>Your full name<input id="setupName" required maxlength="80" autocomplete="off"></label>
      <label>Job title<input id="setupTitle" maxlength="60" placeholder="e.g. Team lead"></label>
      <div class="actions"><button class="btn primary">Continue</button><button type="button" class="btn" data-pcancel>Cancel</button></div></form>`;
    setTimeout(()=>{const n=$("#setupName");if(n)n.focus()},30);return;
  }
  if(pin.stage==="pick"){
    const list=members().filter(x=>!pin.q||x.name.toLowerCase().includes(pin.q.toLowerCase()));
    b.innerHTML=`<h2>Who are you?</h2><p>Pick your name to make changes. Everyone can look without signing in.</p>
      ${members().length>12?`<input type="search" id="pinSearch" placeholder="Search names" value="${esc(pin.q)}" style="border:1px solid var(--line);background:var(--input);border-radius:7px;padding:9px 11px">`:""}
      <div class="pick">${list.map(x=>`<button type="button" data-pm="${esc(x.id)}">${avatar(x.id)}<span>${esc(x.name)}</span><small>${x.pinHash?esc(x.title||ACCESS[x.access]):"No PIN yet"}</small></button>`).join("")||'<div class="empty">No one matches.</div>'}</div>
      <div class="actions" style="justify-content:center"><button type="button" class="btn" data-pcancel>Cancel</button></div>`;
    return;
  }
  const lock=fails.get(pin.memberId);const wait=lock.until&&lock.until>Date.now()?Math.ceil((lock.until-Date.now())/1000):0;
  const heading={enter:"Enter your PIN",create:"Create your 4-digit PIN",confirm:"Enter the same PIN again"}[pin.stage];
  const hint={enter:wait?`Too many wrong tries. Try again in ${wait} seconds.`:"",create:"You'll use it every time you change something. Don't use 1234 or your birthday.",confirm:""}[pin.stage];
  b.innerHTML=`${whoLine}<h2>${heading}</h2>${hint?`<p>${esc(hint)}</p>`:""}${dots}<div class="pin-err" role="alert">${esc(pin.err)}</div>${keys}
    <div class="actions" style="justify-content:center;margin-top:0">
      <button type="button" class="btn small ghost" data-pback>Not ${esc(m?firstName(m.name):"you")}?</button>
      ${pin.stage==="enter"&&state.isOwner?`<button type="button" class="btn small ghost" data-preset>Reset this PIN (board owner)</button>`:""}
      ${pin.stage==="enter"&&!state.isOwner?`<span class="muted" style="font-size:12px">Forgot it? Ask an admin to reset your PIN.</span>`:""}</div>`;
  if(wait){clearTimeout(renderPin._t);renderPin._t=setTimeout(renderPin,1000)}
}
$("#pinBody").addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t||!pin)return;
  if(t.dataset.pcancel!=null){endPin(null);return}
  if(t.dataset.pback!=null){pin.stage="pick";pin.digits="";pin.err="";renderPin();return}
  if(t.dataset.preset!=null){ownerReset();return}

});

document.addEventListener("keydown",e=>{
  if(!pin||!$("#pinDlg").open||!["enter","create","confirm"].includes(pin.stage))return;
  if(/^\d$/.test(e.key)){e.preventDefault();pinKey(e.key)}else if(e.key==="Backspace"){e.preventDefault();pinKey("back")}
});
async function pinKey(k){
  if(!pin)return;const lock=fails.get(pin.memberId);
  if(pin.stage==="enter"&&lock.until>Date.now())return;
  if(k==="back"){pin.digits=pin.digits.slice(0,-1);pin.err="";renderPin();return}
  if(pin.digits.length>=4)return;pin.digits+=k;pin.err="";renderPin();
  if(pin.digits.length<4)return;
  const m=member(pin.memberId);if(!m){pin.stage="pick";renderPin();return}
  const entered=pin.digits;
  if(pin.stage==="create"){
    if(/^(\d)\1{3}$/.test(entered)||["1234","4321","0123","9876"].includes(entered)){pin.digits="";pin.err="That PIN is too easy to guess. Pick another.";shake();return}
    pin.first=entered;pin.digits="";pin.stage="confirm";renderPin();return;
  }
  if(pin.stage==="confirm"){
    if(entered!==pin.first){pin.digits="";pin.first=null;pin.stage="create";pin.err="The PINs didn't match. Start again.";shake();return}
    const salt=uid("s");const h=await hashPin(salt,entered);
    const ok=await enqueue("members/"+m.id,"update",{pinHash:h,pinSalt:salt,pinSetAt:Date.now()});
    if(!ok){pin.digits="";pin.err="Couldn't save your PIN. Try again.";renderPin();return}
    logEvent("security",`created their PIN`,m.id);fails.set(m.id,null);
    const done=member(m.id)||m;endPin(done);unlock(done);toast(`PIN saved. Welcome, ${firstName(m.name)}.`);return;
  }
  // enter
  const h=await hashPin(m.pinSalt,entered);
  if(h===m.pinHash){fails.set(m.id,null);endPin(m);unlock(m);toast(`Unlocked for ${firstName(m.name)}`);return}
  const n=(lock.n||0)+1;const f={n};
  if(n>=5){f.until=Date.now()+60000;f.n=0;logEvent("security",`5 wrong PIN attempts for ${m.name}. Locked for 1 minute on this device`,null)}
  fails.set(m.id,f);pin.digits="";pin.err=n>=5?"Too many wrong tries.":`Wrong PIN. ${5-n} tr${5-n===1?"y":"ies"} left before a 1-minute pause.`;shake();
}
function shake(){renderPin();const d=$("#pinDots");if(d&&!matchMedia("(prefers-reduced-motion: reduce)").matches){d.classList.add("shake")}}
async function ownerReset(){

  await enqueue("members/"+m.id,"update",{pinHash:null,pinSalt:"",pinSetAt:null});

}

/* ================= task operations ================= */
const keyOf=t=>t.key||(/^t-(\d+)$/.test(t.id)?parseInt(t.id.slice(2),10):null);
const nextKey=()=>state.tasks.reduce((a,t)=>Math.max(a,keyOf(t)||0),0)+1;
const shortId=t=>{const k=keyOf(t);return k?`#${state.settings.keyPrefix}-${k}`:""};
const sprintName=id=>id?(sprint(id)?.name||"a removed sprint"):"the backlog";

/* one update to a task, with an activity line in its feed */
function taskUpdate(id,patch,text,by){
  const data={...patch};
  if(text){const eid=uid("a");data.activity={[eid]:{at:Date.now(),by:by||null,text:String(text).slice(0,400)}}}
  return enqueue("tasks/"+id,"update",data);
}
function statusPatch(t,status){
  const patch={status};const now=Date.now();
  if((status==="doing"||status==="review")&&!t.startedAt)patch.startedAt=now;
  if(status==="done"){patch.doneAt=now;if(!t.startedAt)patch.startedAt=now}
  else if(t.doneAt)patch.doneAt=null;
  if(status==="blocked"){patch.blockedAt=now;if(!t.startedAt)patch.startedAt=now}
  else if(t.status==="blocked"){patch.blockedAt=null;if(t.blockedAt)patch.blockedMs=(t.blockedMs||0)+(now-t.blockedAt)}
  return patch;
}
function moveTask(id,status){
  return act(m=>{const t=task(id);if(!t||t.status===status)return;
    return taskUpdate(id,statusPatch(t,status),`moved this from ${COLS[t.status]} to ${COLS[status]}`,m.id)});
}
const FIELD_LABEL={title:"the title",type:"the type",priority:"the priority",points:"the story points",estimateH:"the estimate",erpRef:"the ERP reference",labels:"the labels",blockedReason:"the blocked reason",description:"the description"};
function fieldText(f,v,t){
  if(f==="sprintId")return `moved this to ${sprintName(v)}`;
  if(f==="title")return `renamed this to "${v}"`;
  if(f==="description")return "updated the description";
  if(f==="type")return `changed the type to ${TYPES[v]}`;
  if(f==="priority")return `changed the priority to ${PRIO[v]}`;
  if(f==="points")return `changed the story points from ${t.points} to ${v}`;
  if(f==="estimateH")return `changed the estimate from ${fmtH(t.estimateH)} to ${fmtH(v)}`;
  if(f==="erpRef")return v?`linked this to ERP ${v}`:"removed the ERP reference";
  if(f==="labels")return v.length?`set the labels to ${v.join(", ")}`:"removed the labels";
  if(f==="blockedReason")return v?`set the blocked reason: ${v}`:"cleared the blocked reason";
  return `changed ${FIELD_LABEL[f]||f}`;
}
async function setField(id,f,v){
  const t=task(id);if(!t)return;
  if(f==="status"){const ok=await moveTask(id,v);if(!ok)renderTW();return}
  const cur=f==="labels"?t.labels.join("|"):String(t[f]??"");const nv=f==="labels"?v.join("|"):String(v??"");
  if(cur===nv)return;
  const ok=await act(m=>taskUpdate(id,{[f]:v},fieldText(f,v,t),m.id));
  if(!ok)renderTW();
}
/* several people can share a task; stored as a map so two people adding at once don't overwrite each other */
function addAssignee(id,pid){
  return act(m=>{if(m.access!=="admin"){toast("Only admins change who works on a task.");return false}const t=task(id);if(!t||!pid||t.assignees.includes(pid))return;
    return taskUpdate(id,{assignees:{[pid]:{at:Date.now()}}},pid===m.id?"joined this task":`added ${mName(pid)} to this task`,m.id)});
}
function removeAssignee(id,pid){
  return act(m=>{if(m.access!=="admin"){toast("Only admins change who works on a task.");return false}const t=task(id);if(!t||!t.assignees.includes(pid))return;
    const patch={assignees:{[pid]:null}};if(t.legacyAssignee===pid)patch.assignee=null;
    return taskUpdate(id,patch,pid===m.id?"left this task":`removed ${mName(pid)} from this task`,m.id)});
}
async function trashTask(id){
  const t=task(id);if(!t)return;
  const ok=await act(async m=>{
    if(m.access!=="admin"){toast("Only admins can delete tasks.");return false}
    if(!await ask({title:`Delete ${shortId(t)} ${t.title}?`,body:"It moves to the Trash. An admin can restore it from there.",ok:"Delete task",danger:true}))return false;
    return taskUpdate(id,{deleted:true,deletedAt:Date.now(),deletedBy:m.id},"deleted this task",m.id);
  });
  if(ok){closeTW();toast("Task moved to Trash",{fn:()=>act(m=>taskUpdate(id,{deleted:false,deletedAt:null,deletedBy:null},"restored this task",m.id))})}
}

function keepFocus(root,fn){
  const a=document.activeElement;let k=null;
  if(a&&a.id&&root.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){k={id:a.id,v:a.value,s:null,e:null};try{k.s=a.selectionStart;k.e=a.selectionEnd}catch(x){}}
  const sc=[...root.querySelectorAll("[data-keepscroll]")].map(el=>[el.dataset.keepscroll,el.scrollTop]);
  fn();
  sc.forEach(([n,y])=>{const el=root.querySelector(`[data-keepscroll="${n}"]`);if(el)el.scrollTop=y});
  if(k){const el=document.getElementById(k.id);if(el){if(el.tagName!=="SELECT")el.value=k.v;el.focus({preventScroll:true});try{if(k.s!=null)el.setSelectionRange(k.s,k.e)}catch(x){}}}
}
function fileKind(f){const n=f.name.toLowerCase();if(/^image\//.test(f.type))return"img";if(/pdf/.test(f.type)||n.endsWith(".pdf"))return"PDF";const x=n.split(".").pop();return x&&x.length<6?x.toUpperCase():"FILE"}
const blobCache={};
function fileSrc(f){return f.assetId?"/_blob/"+f.assetId:(blobCache[f.blobId]||null)}
async function loadBlob(f){
  if(!f.blobId||blobCache[f.blobId]||!db)return;
  try{const s=await db.doc("blobs/"+f.blobId).get();if(s.exists&&typeof s.data().data==="string"){blobCache[f.blobId]=s.data().data;if(tw.id)renderTW()}}catch(e){}
}

}

function startTimer(id){
  return act(async m=>{
    const running=state.tasks.filter(x=>!x.deleted&&x.timers[m.id]&&x.id!==id);
    for(const r of running)await stopTimer(r.id,true,m);
    return taskUpdate(id,{timers:{[m.id]:{startedAt:Date.now()}}},"started a timer",m.id);
  });
}
function stopTimer(id,log,who_){
  const run=async m=>{
    const t=task(id);const tm=t&&t.timers[m.id];if(!tm)return;
    const h=Math.round((Date.now()-tm.startedAt)/36000)/100;
    const patch={timers:{[m.id]:null}};let text="stopped the timer without logging";
    if(log&&h>=0.01){patch.worklogs={[uid("w")]:{by:m.id,date:iso(new Date(tm.startedAt)),hours:Math.min(h,24),note:"",at:Date.now(),timer:true}};text=`logged ${fmtH(Math.min(h,24))} with the timer`}
    else if(log)text="stopped the timer (under a minute, nothing logged)";
    const ok=await taskUpdate(id,patch,text,m.id);if(ok&&log)toast(h>=0.01?`Logged ${fmtH(Math.min(h,24))} on ${shortId(t)}`:"Under a minute, so nothing was logged");return ok;
  };
  return who_?run(who_):act(run);
}

/* ---- files ---- */
const ASSET_TYPES={png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",svg:"image/svg+xml",pdf:"application/pdf",mp4:"video/mp4",webm:"video/webm",csv:"text/csv",md:"text/markdown",json:"application/json",txt:"text/plain"};
function assetType(f){const ext=(f.name.split(".").pop()||"").toLowerCase();const t=ASSET_TYPES[ext];if(t)return t;return Object.values(ASSET_TYPES).includes(f.type)?f.type:null}
const readDataUrl=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
async function uploadFiles(id,list){
  if(!list.length)return;
  await act(async m=>{
    for(const f of list){
      if(f.size>20*1048576){toast(`${f.name} is larger than 20 MB.`);continue}
      const entry={name:f.name.slice(0,200),size:f.size,type:f.type||"",by:m.id,at:Date.now()};
      const at=assetType(f);
      if(assets&&at){
        toast(`Uploading ${f.name}…`);
        try{const r=await assets.upload(f,{type:at});entry.assetId=r.id;entry.type=at}
        catch(e){const c=e&&e.code;if(c==="too_large"){toast(`${f.name} is too large for this type.`);continue}
          if(c==="quota_or_state"){toast("File storage for this board is full. Remove old files first.");continue}}
      }
      if(!entry.assetId){
        if(f.size>150*1024){toast(assets?`${f.name} is a file type the board can't store. Images, PDF, video, CSV and text files work up to 20 MB; other files up to 150 KB.`:`Your account can only attach files up to 150 KB here. Ask the board owner to make you an Editor for bigger files.`);continue}
        try{const bid=uid("b");const data=await readDataUrl(f);if(!await enqueue("blobs/"+bid,"set",{name:entry.name,type:f.type||"",data,taskId:id,at:Date.now()}))continue;entry.blobId=bid;blobCache[bid]=data}
        catch(e){toast(`Couldn't read ${f.name}.`);continue}
      }
      await taskUpdate(id,{files:{[uid("f")]:entry}},`attached ${entry.name}`,m.id);
    }
  });
}
async function fileBlob(f){
  if(f.assetId){const r=await fetch("/_blob/"+f.assetId);if(!r.ok)throw new Error("missing");return r.blob()}
  if(!blobCache[f.blobId])await loadBlob(f);const u=blobCache[f.blobId];if(!u)throw new Error("missing");
  return (await fetch(u)).blob();
}
async function saveFile(f){
  if(!downloads){toast("Saving files isn't available in this view.");return}
  try{await downloads.save({filename:f.name,data:await fileBlob(f)})}catch(e){if(e&&e.message==="missing")toast("This file is no longer available.")}
}
async function openFile(f){
  if(/^image\//.test(f.type)){

function burndown(s,ts){
  const start=parseDate(s.start),end=parseDate(s.end);const days=Math.round((end-start)/DAY)+1;
  const total=ts.reduce((a,t)=>a+t.points,0);if(!total||days<2)return '<div class="empty">No points committed to this sprint yet.</div>';
  const W=640,H=230,L=36,R=12,T=12,B=28;const x=i=>L+i*(W-L-R)/(days-1);const y=v=>T+(1-v/total)*(H-T-B);
  const now=Date.now();const pts=[];
  for(let i=0;i<days;i++){const dayEnd=start+(i+1)*DAY;if(start+i*DAY>now)break;
    const done=ts.filter(t=>t.status==="done"&&t.doneAt&&t.doneAt<dayEnd).reduce((a,t)=>a+t.points,0);pts.push([x(i),y(total-done)])}
  let grid="";for(let k=0;k<=4;k++){const v=Math.round(total*k/4);grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`}
  let labels="";const step=Math.max(1,Math.ceil(days/7));for(let i=0;i<days;i+=step){labels+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${new Date(start+i*DAY).toLocaleDateString(undefined,{day:"numeric",month:"short"})}</text>`}
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Burndown chart">${grid}${labels}
    <line x1="${x(0)}" y1="${y(total)}" x2="${x(days-1)}" y2="${y(0)}" stroke="var(--muted)" stroke-dasharray="4 4"/>
    ${pts.length?`<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${pts.map(p=>p.join(",")).join(" ")}"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="4" fill="var(--accent)"/>`:""}</svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>Remaining points</span><span><i style="background:var(--muted)"></i>Ideal pace</span></div>`;
}
const donePts=sid=>liveTasks().filter(t=>t.sprintId===sid&&t.status==="done").reduce((a,t)=>a+t.points,0);
function velocity(){
  const s=sortedSprints().filter(x=>x.state!=="planned").slice(-6);if(!s.length)return '<div class="empty">Velocity appears after your first sprint.</div>';
  const v=s.map(sp=>({sp,done:donePts(sp.id),committed:liveTasks().filter(t=>t.sprintId===sp.id).reduce((a,t)=>a+t.points,0)}));
  const max=Math.max(1,...v.map(x=>Math.max(x.done,x.committed)));const W=640,H=220,B=28,T=16,bw=(W-40)/v.length;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Velocity chart">${v.map((x,i)=>{
    const x0=20+i*bw+bw*.2,w=bw*.6,hc=(x.committed/max)*(H-B-T),hd=(x.done/max)*(H-B-T);
    return `<rect x="${x0}" y="${H-B-hc}" width="${w}" height="${hc}" fill="var(--line)" rx="3"/>
      <rect x="${x0+w*.2}" y="${H-B-hd}" width="${w*.6}" height="${hd}" fill="${x.sp.state==="active"?"var(--amber)":"var(--accent)"}" rx="3"/>
      <text x="${x0+w/2}" y="${H-B-Math.max(hc,hd)-4}" text-anchor="middle">${x.done}/${x.committed}</text>
      <text x="${x0+w/2}" y="${H-8}" text-anchor="middle">${esc(x.sp.name)}</text>`}).join("")}</svg>
    <div class="legend"><span><i style="background:var(--accent);height:10px"></i>Done points</span><span><i style="background:var(--line);height:10px"></i>Committed</span><span><i style="background:var(--amber);height:10px"></i>Current sprint so far</span></div>`;
}
function sprintRemarks(n){
  const out=[];sprintTasks().forEach(t=>t.comments.forEach(c=>out.push({...c,task:t})));
  return out.sort((a,b)=>b.at-a.at).slice(0,n);
}
function remarkRow(c){

    <b>${esc(mName(c.by))}</b><span>on</span><button class="linkish" data-open="${esc(c.task.id)}">${esc(shortId(c.task))} ${esc(c.task.title)}</button>
    <span>${timeAgo(c.at)}</span>${c.resolved?"<span>· resolved</span>":""}</div><p>${esc(c.text)}</p></div>`;

function viewInsights(){

    <div class="stat"><b>${hr(logged)}<small style="font-size:16px"> / ${hr(est)} h</small></b><small>Logged vs estimated</small></div>

    <div class="panel"><h2>Blocked work</h2>${blocked.length?`<table><tbody>${blocked.map(t=>`<tr><td><button class="linkish" data-open="${esc(t.id)}">${esc(t.title)}</button>${t.blockedReason?`<br><small>${esc(t.blockedReason)}</small>`:""}</td><td>${esc(names(t)||"–")}</td><td class="num">${blockedDays(t)} d</td></tr>`).join("")}</tbody></table>`:'<div class="empty">Nothing is blocked.</div>'}
    <h3 style="margin-top:18px">Cycle time by type</h3><table><tbody>${byType}</tbody></table></div></div>
  <div class="two"><div class="panel"><h2>Velocity</h2>${velocity()}</div>
    <div class="panel"><h2>Hours by ERP reference</h2>${erpRows?`<div class="tbl-scroll"><table><thead><tr><th>ERP ref</th><th class="num">Tasks</th><th class="num">Est.</th><th class="num">Logged</th></tr></thead><tbody>${erpRows}</tbody></table></div>`:'<div class="empty">No tasks in this sprint.</div>'}
    ${downloads?`<div class="actions"><button class="btn" data-export>Export worklogs for ERP (CSV)</button></div><p class="goal" style="margin:8px 0 0">One row per worklog: date, person, hours, task and ERP reference, ready for costing or payroll import.</p>`:""}</div></div>
  <div class="panel"><h2>Issues and remarks this sprint</h2>${rc.length?rc.map(remarkRow).join(""):'<div class="empty">No comments yet. Team members add them from any task.</div>'}</div>`;

async function exportCsv(){

function weekDots(s){

function ovChart(s,ts){
  const start=parseDate(s.start),days=Math.round((parseDate(s.end)-start)/DAY)+1;
  const total=ts.reduce((a,t)=>a+t.points,0);
  if(!total)return '<div class="empty">No story points in this sprint yet. Plan tasks from the Backlog.</div>';
  const W=640,H=250,L=34,R=14,T=14,B=30;const x=i=>L+i*(W-L-R)/days;const y=v=>T+(1-v/total)*(H-T-B);
  const now=Date.now(),burn=state.chartMode==="burndown";let path=`M${x(0)},${y(burn?total:0)}`,last=0;
  for(let i=0;i<days;i++){if(start+i*DAY>now)break;
    const done=ts.filter(t=>t.status==="done"&&t.doneAt&&t.doneAt<start+(i+1)*DAY).reduce((a,t)=>a+t.points,0);
    path+=` H${x(i+1)} V${y(burn?total-done:done)}`;last=i+1}
  const area=`${path} H${x(last)} V${y(0)} H${x(0)} Z`;
  let grid="";for(let k=0;k<=4;k++){const v=Math.round(total*k/4);grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`}
  const step=days>7?2:1;let lbl="";for(let i=0;i<days;i+=step)lbl+=`<text x="${(x(i)+x(i+1))/2}" y="${H-8}" text-anchor="middle">${new Date(start+i*DAY).toLocaleDateString(undefined,days>7?{day:"numeric",month:"short"}:{weekday:"short"})}</text>`;
  const guide=burn?`<line x1="${x(0)}" y1="${y(total)}" x2="${x(days)}" y2="${y(0)}" stroke="var(--muted)" stroke-dasharray="5 5"/>`:`<line x1="${x(0)}" y1="${y(total)}" x2="${x(days)}" y2="${y(total)}" stroke="var(--muted)" stroke-dasharray="5 5"/>`;
  return `<div class="chart-legend"><span><i style="border:2px solid var(--accent)"></i>${burn?"Points remaining":"Points done"}</span><span><i style="border:2px dashed var(--muted)"></i>${burn?"Guideline":"Sprint scope"}</span></div>

function scopeSprintIds(){
  if(state.topScope==="sprint")return state.sprintId?[state.sprintId]:[];
  return sortedSprints().filter(x=>x.state!=="planned").slice(-3).map(x=>x.id);
}
function scores(){
  const ids=new Set(scopeSprintIds());const ts=liveTasks().filter(t=>ids.has(t.sprintId));
  const rows=members().map(m=>{
    const mine=ts.filter(t=>isOn(t,m.id));const done=mine.filter(t=>t.status==="done");
    const committed=mine.reduce((a,t)=>a+t.points*share(t),0),D=r1(done.reduce((a,t)=>a+t.points*share(t),0));
    const est=done.reduce((a,t)=>a+t.estimateH*share(t),0),log=done.reduce((a,t)=>a+loggedBy(t,m.id),0);
    return {m,committed,D,C:committed?D/committed:0,acc:est&&log?Math.max(0,1-Math.abs(log-est)/est):null,n:done.length};
  }).filter(r=>r.D>0);
  const maxD=Math.max(1,...rows.map(r=>r.D));
  rows.forEach(r=>{r.score=Math.round(50*r.D/maxD+30*r.C+20*(r.acc??0.5))});
  return rows.sort((a,b)=>b.score-a.score||b.D-a.D);
}

    <div class="score">${r.score}<small>score out of 100</small></div>
    <div class="brk"><span class="chip">${r.D} pts delivered</span><span class="chip">${Math.round(r.C*100)}% of commitment done</span><span class="chip">${r.acc==null?"no hours logged":Math.round(r.acc*100)+"% estimate accuracy"}</span></div></div>`).join("")}</div>`;
}

/* ================= backups =================
   A backup is one metadata document plus the data split into parts
   (documents are capped at 256 KB). Parts are written first, the
   metadata last, so a half-written backup never shows up. */
const PART=60000;
function snapshotData(){
  const pick=col=>Object.fromEntries(Object.entries(raw[col]).map(([k,v])=>[k,v]));
  return {format:"teamboard",version:2,at:Date.now(),members:pick("members"),sprints:pick("sprints"),tasks:pick("tasks"),config:pick("config")};
}
const countsOf=d=>({tasks:Object.values(d.tasks||{}).filter(t=>t&&!t.deleted).length,members:Object.values(d.members||{}).filter(m=>m&&!m.deleted).length,sprints:Object.values(d.sprints||{}).filter(s=>s&&!s.deleted).length});
async function makeBackup(kind,note,by,{quiet=false}={}){
  const data=snapshotData();const json=JSON.stringify(data);const id=`${kind==="daily"?"d":"b"}-${todayIso()}-${Date.now().toString(36)}`;
  const n=Math.max(1,Math.ceil(json.length/PART));
  for(let i=0;i<n;i++){if(!await enqueue(`backups/${id}/parts/${i}`,"set",{i,json:json.slice(i*PART,(i+1)*PART)},{quiet}))return null}
  const ok=await enqueue("backups/"+id,"set",{kind,note:note||"",by:by||null,at:Date.now(),day:todayIso(),parts:n,size:json.length,counts:countsOf(data)},{quiet});
  if(!ok)return null;
  pruneBackups(id);return id;
}
async function deleteBackup(b){
  await enqueue("backups/"+b.id,"delete");
  for(let i=0;i<b.parts;i++)await enqueue(`backups/${b.id}/parts/${i}`,"delete",null,{quiet:true});
}
function pruneBackups(justMade){
  const all=state.backups.filter(b=>b.id!==justMade).sort((a,b)=>b.at-a.at);
  const daily=all.filter(b=>b.kind==="daily"),other=all.filter(b=>b.kind!=="daily");
  [...daily.slice(Math.max(0,state.settings.keepDaily-1)),...other.slice(Math.max(0,state.settings.keepOther-1))].forEach(b=>deleteBackup(b));
}
async function readBackup(b){
  const parts=[];
  for(let i=0;i<b.parts;i++){const s=await db.doc(`backups/${b.id}/parts/${i}`).get();if(!s.exists)throw new Error("A part of this backup is missing.");parts.push(s.data().json)}
  return validBackup(JSON.parse(parts.join("")));
}
function validBackup(d){
  if(!d||d.format!=="teamboard"||typeof d.tasks!=="object"||typeof d.members!=="object"||typeof d.sprints!=="object")throw new Error("This isn't a Team board backup.");
  return d;
}
let dailyChecked=false;
async function maybeDailyBackup(){
  if(dailyChecked||!db||!["tasks","members","sprints","config","backups"].every(c=>state.loaded[c]))return;
  dailyChecked=true;
  if(!state.settings.dailyBackup||!Object.keys(raw.tasks).length&&!Object.keys(raw.members).length)return;
  if(state.backups.some(b=>b.kind==="daily"&&b.day===todayIso()))return;
  try{
    const r=await db.doc("config/backup-lease").acquire({holder:clientId,ttlMs:120000});if(!r.acquired)return;
    const again=await db.collection("backups").where("day","==",todayIso()).get();
    if(again.docs.some(d=>d.data().kind==="daily"))return;
    await makeBackup("daily","Automatic daily backup",null,{quiet:true});
  }catch(e){/* view-only viewers can't write; someone else will */}
}
async function restoreData(d,label,m){
  toast("Restoring…");
  await makeBackup("safety",`Before restoring ${label}`,m.id);
  for(const col of ["members","sprints","tasks"]){
    const keep=d[col]||{};
    for(const [id,doc] of Object.entries(keep))if(doc&&typeof doc==="object")await enqueue(`${col}/${id}`,"set",doc);
    for(const id of Object.keys(raw[col]))if(!keep[id])await enqueue(`${col}/${id}`,"delete");
  }
  for(const [id,doc] of Object.entries(d.config||{}))if(["board","settings"].includes(id)&&doc)await enqueue("config/"+id,"set",doc);
  logEvent("backup",`restored ${label}`,m.id);
  toast(`Restored ${label}. A backup of what was there before was saved first.`);
}

/* ================= admin: data retention ================= */
async function purgeTrash(m,silent){
  const cut=Date.now()-state.settings.trashDays*DAY;let n=0;
  for(const col of ["tasks","members","sprints"])for(const x of state[col])if(x.deleted&&x.deletedAt&&x.deletedAt<cut){await enqueue(`${col}/${x.id}`,"delete",null,{quiet:true});n++}
  const oldLogs=state.logs.filter(l=>l.day<iso(new Date(Date.now()-365*DAY)));for(const l of oldLogs)await enqueue("log/"+l.day,"delete",null,{quiet:true});
  if(n&&!silent)logEvent("backup",`emptied ${n} item${n>1?"s":""} older than ${state.settings.trashDays} days from the Trash`,m&&m.id);
}

function snapView(){
  const k={y:window.scrollY,bx:$(".board-scroll")?.scrollLeft||0,cols:{},vals:[],foc:null};
  document.querySelectorAll(".col-body").forEach(b=>k.cols[b.parentElement.dataset.status]=b.scrollTop);
  document.querySelectorAll("#main form").forEach(f=>[...f.elements].forEach(el=>{
    if(el.id&&/INPUT|TEXTAREA|SELECT/.test(el.tagName)&&el.type!=="submit"&&(el.tagName==="SELECT"||el.value!==el.defaultValue))k.vals.push([el.id,el.type==="checkbox"?el.checked:el.value])}));
  const a=document.activeElement;
  if(a&&a.id&&$("#main").contains(a)&&a.closest("form")){let s=null,e=null;try{s=a.selectionStart;e=a.selectionEnd}catch(x){}k.foc=[a.id,s,e]}
  return k;
}
function restoreView(k){
  const bs=$(".board-scroll");if(bs)bs.scrollLeft=k.bx;
  document.querySelectorAll(".col-body").forEach(b=>{const v=k.cols[b.parentElement.dataset.status];if(v)b.scrollTop=v});
  k.vals.forEach(([id,v])=>{const el=document.getElementById(id);if(el){if(el.type==="checkbox")el.checked=v;else el.value=v}});
  if(k.foc){const el=document.getElementById(k.foc[0]);if(el){el.focus({preventScroll:true});try{if(k.foc[1]!=null)el.setSelectionRange(k.foc[1],k.foc[2])}catch(x){}}}
  if(Math.abs(window.scrollY-k.y)>1)window.scrollTo(0,k.y);
}

}

function chooseSprint(id){state.sprintId=id;state.followActive=sprint(id)?.state==="active";render()}
$("#sprintSel").addEventListener("change",e=>chooseSprint(e.target.value));
$("#tvBtn").addEventListener("click",enterTv);
$("#newTask").addEventListener("click",()=>openNew({sprintId:["board","overview"].includes(state.view)?state.sprintId:""}));
document.addEventListener("keydown",e=>{
  if(!state.tv||document.querySelector("dialog[open]")||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.key===" "&&e.target.tagName==="BUTTON")return;
  if(e.key==="ArrowRight")tvGo(state.tvSlide+1);else if(e.key==="ArrowLeft")tvGo(state.tvSlide-1);
  else if(e.key==="Escape")exitTv();else if(e.key===" "){e.preventDefault();state.tvPaused=!state.tvPaused;render()}
});
const main=$("#main");
main.addEventListener("input",e=>{
  if(e.target.id==="q"){state.q=e.target.value;render()}
  if(e.target.id==="admQ"){state.adm.q=e.target.value;render()}
});
main.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="who"){state.who=t.value;render()}
  if(t.id==="typeF"){state.type=t.value;render()}
  if(t.id==="admWho"){state.adm.who=t.value;render()}
  if(t.id==="admKind"){state.adm.kind=t.value;render()}
  if(t.dataset.plan&&t.value){const id=t.dataset.plan,sid=t.value;const ok=await act(m=>taskUpdate(id,{sprintId:sid},`moved this to ${sprintName(sid)}`,m.id));if(ok)toast("Moved to "+sprintName(sid));else render()}
});
main.addEventListener("click",async e=>{
  const b=e.target.closest("button,[data-id]");if(!b)return;const d=b.dataset;
  if(await adminClick(d))return;
  if(d.colmove){const id=d.colmove;state.menuFor=null;await moveColumn(id,state.order.indexOf(id)+Number(d.dir));return}
  if(d.tvgo!=null)return tvGo(+d.tvgo);
  if(d.tvpause!=null){state.tvPaused=!state.tvPaused;return render()}
  if(d.tvexit!=null)return exitTv();
  if(d.scope){state.topScope=d.scope;return render()}
  if(d.mine!=null){const lm=lastMe();state.who=state.who===lm?"":lm;return render()}
  if(d.check){const t=task(d.check);if(t){const done=t.status!=="done";const ok=await moveTask(t.id,done?"done":"doing");if(ok!==false)toast(done?"Marked as done":"Moved back to In progress")}return}
  if(d.colmenu){state.menuFor=state.menuFor===d.colmenu?null:d.colmenu;return render()}
  if(d.addin){state.menuFor=null;render();return openNew({sprintId:state.sprintId,status:d.addin})}
  if(d.sprnav){const ss=sortedSprints();const i=ss.findIndex(x=>x.id===state.sprintId)+Number(d.sprnav);if(ss[i])chooseSprint(ss[i].id);return}
  if(d.finish)return finishSprint(d.finish);
  if(d.startsp)return startSprint(d.startsp);
  if(d.delsprint){const s=sprint(d.delsprint);if(s)act(async m=>{if(liveTasks().some(t=>t.sprintId===s.id)){toast("Move its tasks out first.");return}
    await enqueue("sprints/"+s.id,"update",{deleted:true,deletedAt:Date.now(),deletedBy:m.id});logEvent("sprint",`deleted ${s.name}`,m.id);toast(`${s.name} moved to Trash`)});return}
  if(d.chart){state.chartMode=d.chart;return render()}
  if(d.goview){state.view=d.goview;return render()}
  if(d.goadmin){state.view="admin";state.adm.tab=d.goadmin;return render()}
  if(d.planweek!=null){act(async m=>{const nw=nextWeek();if(await enqueue("sprints/"+uid("s"),"set",{...nw,goal:"",state:"planned"})){logEvent("sprint",`planned ${nw.name}`,m.id);toast(`${nw.name} planned`)}});return}
  if(d.export!=null)return exportCsv();
  if(d.open)return openTW(d.open);
  if(b.classList.contains("card"))return openTW(d.id);
});
main.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="setForm")return saveSettings();
  if(f.id==="sprintForm"){
    const name=$("#spName").value.trim(),start=$("#spStart").value,end=$("#spEnd").value,goal=$("#spGoal").value.trim();
    if(!name)return;if(!isoOk(start)||!isoOk(end)||end<start){toast("The end date can't be before the start date.");return}
    await act(async m=>{if(await enqueue("sprints/"+uid("s"),"set",{name,start,end,goal,state:"planned"})){logEvent("sprint",`created ${name}`,m.id);toast(`${name} created`);f.reset()}});
  }
});
main.addEventListener("keydown",e=>{const c=e.target.closest&&e.target.closest(".card");if(c&&e.target===c&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openTW(c.dataset.id)}});
document.addEventListener("click",e=>{if(state.menuFor&&!e.target.closest(".col-h")){state.menuFor=null;render()}});
/* drag and drop on the board (mouse). On touchscreens use the Status menu in the task window. */
let dragKind=null,dragId=null;
const clearMarks=()=>document.querySelectorAll(".col").forEach(c=>c.classList.remove("over","col-before","col-after","dragging"));
main.addEventListener("dragstart",e=>{
  const h=e.target.closest("[data-colid]");
  if(h){dragKind="col";dragId=h.dataset.colid;e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain","col:"+dragId);h.parentElement.classList.add("dragging");return}
  const c=e.target.closest(".card");if(c){dragKind="card";dragId=c.dataset.id;e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",c.dataset.id)}
});
function colSide(col,e){const r=col.getBoundingClientRect();return e.clientX<r.left+r.width/2?"before":"after"}
main.addEventListener("dragover",e=>{
  const col=e.target.closest(".col");if(!col||!dragKind)return;e.preventDefault();
  if(dragKind==="card"){col.classList.add("over");return}
  if(col.dataset.status===dragId)return;
  const side=colSide(col,e);col.classList.toggle("col-before",side==="before");col.classList.toggle("col-after",side==="after");
});
main.addEventListener("dragleave",e=>{const col=e.target.closest(".col");if(col&&!col.contains(e.relatedTarget))col.classList.remove("over","col-before","col-after")});
main.addEventListener("drop",e=>{
  const col=e.target.closest(".col");if(!col||!dragKind)return;e.preventDefault();
  const kind=dragKind,id=dragId;dragKind=dragId=null;
  if(kind==="card"){clearMarks();moveTask(id,col.dataset.status);return}
  const target=col.dataset.status;if(target===id){clearMarks();return}
  const side=colSide(col,e);const rest=state.order.filter(k=>k!==id);
  clearMarks();moveColumn(id,rest.indexOf(target)+(side==="after"?1:0));
});
main.addEventListener("dragend",()=>{dragKind=dragId=null;clearMarks()});

/* ================= start ================= */
if(location.hash==="#tv"||ls.get("tb.tv")==="1"){state.tv=true;document.body.classList.add("tv")}
render();
(async()=>{
  const c=window.claude;
  const get=n=>c&&c.use?c.use(n).catch(()=>null):Promise.resolve(null);
  const [d,dl,as,u]=await Promise.all([get("db"),get("downloads"),get("assets"),get("user")]);
  downloads=dl;assets=as;userCap=u;
  if(u){try{state.isOwner=!!(await u.isOwner())}catch(e){}}
  if(!d){setNotice("Shared storage isn't available in this view, so changes stay on this screen only and are lost when you close it.");saveStatus();render();return}
  db=d;saveStatus();
  ["members","sprints","tasks"].forEach(subscribe);
  db.collection("config").onSnapshot(s=>{const r={};s.docs.forEach(x=>{r[x.id]=x.data()});raw.config=r;rebuild("config");state.loaded.config=true;render();maybeDailyBackup()},snapErr);
  db.collection("log").where("day",">=",iso(new Date(Date.now()-400*DAY))).onSnapshot(s=>{state.logs=s.docs.map(x=>({day:x.id,...x.data()}));if(state.view==="admin")render()},snapErr);
  db.collection("backups").onSnapshot(s=>{state.backups=s.docs.map(x=>{const o=x.data();return {id:x.id,kind:str(o.kind,20)||"manual",note:str(o.note,200),by:typeof o.by==="string"?o.by:null,at:num(o.at),day:str(o.day,10),parts:Math.max(1,num(o.parts,1)),size:num(o.size),counts:{tasks:0,members:0,sprints:0,...(o.counts||{})}}});state.loaded.backups=true;if(state.view==="admin")render();maybeDailyBackup()},snapErr);
  db.doc("erp/main").onSnapshot(s=>{state.erp=s.exists?s.data():null;if(state.view!=="erp")render();else if($("#twDlg").open)renderTW()},()=>{});
  if(Q.ops.length){toast(`Saving ${Q.ops.length} change${Q.ops.length>1?"s":""} left over from last time`);pump()}
})();
</script>
